<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 460px;
            margin: 24px auto;
            padding: 0 16px;
            background: #f6f7f9;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
            cursor: pointer;
            margin-top: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .badge {
            font-weight: bold;
            color: #0f766e;
        }
    </style>
</head>

<body>
    <h2>Restaurant Table Portal</h2>

    <!-- Step 1: QR Scan + Phone Registration -->
    <div class="card">
        <h3>1. Register Session</h3>
        <label>Table Number</label>
        <input id="tableNum" type="number" value="1" min="1" />
        <label>Phone Number</label>
        <input id="phoneInput" type="tel" placeholder="+88017XXXXXXXX" />
        <button onclick="startSession()">Start Session</button>
        <p>Session ID: <span id="sessionId" class="badge">Not started</span></p>
    </div>

    <!-- Step 2: Menu & Pre/Post Pay -->
    <div class="card">
        <h3>2. Place Order</h3>
        <label>Select Item</label>
        <select id="itemSelect">
            <option value="Beef Burger|450">Beef Burger — 450 BDT</option>
            <option value="Pasta Alfredo|520">Pasta Alfredo — 520 BDT</option>
            <option value="Cold Coffee|180">Cold Coffee — 180 BDT</option>
        </select>
        <label>Payment Mode</label>
        <select id="payMode">
            <option value="PRE_PAY">Pre-Pay (Pay Before Kitchen)</option>
            <option value="POST_PAY">Post-Pay (Pay After Eating)</option>
        </select>
        <button onclick="placeOrder()">Submit Order</button>
    </div>

    <!-- Step 3: Live Food Status + Buzz -->
    <div class="card">
        <h3>3. Live Food Status</h3>
        <p>Status: <span id="foodStatus" class="badge">NO_ORDER</span></p>
        <button onclick="simulateReady()">Simulate Kitchen: READY (Buzz)</button>
    </div>

    <!-- Step 4: Pay & Review -->
    <div class="card">
        <h3>4. Payment & Review</h3>
        <p>Payment: <span id="payStatus" class="badge">UNPAID</span></p>
        <button onclick="markPaid()">Pay Now</button>
        <label>Review</label>
        <textarea id="reviewText" rows="2" placeholder="How was your meal?"></textarea>
        <button onclick="submitReview()">Submit Review</button>
        <p id="reviewMsg"></p>
    </div>

    <script>
        let currentSession = null;

        function startSession() {
            const phone = document.getElementById("phoneInput").value.trim();
            const table = document.getElementById("tableNum").value;
            if (!phone) return alert("Enter a phone number first.");
            currentSession = "T" + table + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById("sessionId").innerText = currentSession;
        }

        function placeOrder() {
            if (!currentSession) return alert("Start a session first.");
            const mode = document.getElementById("payMode").value;
            document.getElementById("foodStatus").innerText = "PENDING";
            if (mode === "PRE_PAY") {
                document.getElementById("payStatus").innerText = "PAID";
            }
        }

        function simulateReady() {
            document.getElementById("foodStatus").innerText = "READY";
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500]);
            }
            alert("Food is READY! Buzzing your phone.");
        }

        function markPaid() {
            document.getElementById("payStatus").innerText = "PAID";
        }

        function submitReview() {
            const text = document.getElementById("reviewText").value.trim();
            document.getElementById("reviewMsg").innerText = text ? "Review saved: " + text : "Enter a comment first.";
        }
    </script>
</body>

</html>
