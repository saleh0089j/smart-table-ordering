<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen & Reception Control</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 2px solid #334155;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .toolbar input, .toolbar select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    .toolbar button {
      width: auto;
      padding: 8px 14px;
      font-size: 14px;
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 18px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      border-top: 8px solid #eab308;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.locked {
      border: 2px solid #ef4444;
      border-top: 8px solid #ef4444;
      background: #2a1720;
    }
    .card.PREPARING { border-top-color: #3b82f6; }
    .card.READY { border-top-color: #22c55e; }
    .order-top {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      gap: 6px;
    }
    .guest-tag {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .lock-note {
      font-size: 13px;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: #334155;
      white-space: nowrap;
    }
    .badge.locked-badge {
      background: #ef4444;
      color: #ffffff;
      font-weight: bold;
    }
    ul.item-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      font-size: 17px;
      line-height: 1.55;
    }
    ul.item-list li {
      padding: 3px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
    }
    ul.item-list li:last-child { border-bottom: none; }
    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #eab308;
      color: #0f172a;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.unlock-btn { background: #22c55e; color: #0f172a; }
    .card.PREPARING button.stage-btn { background: #22c55e; }
    .card.READY button.stage-btn { background: #64748b; color: #f8fafc; }
    button.pa-btn { background: #38bdf8; color: #0f172a; }
    .menu-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-top: 28px;
    }
    .add-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }
    .add-form input[type="text"],
    .add-form input[type="number"],
    .add-form input[type="file"] {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
    }
    .menu-row img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      background: #0f172a;
    }
    .mini-btn {
      width: auto;
      padding: 7px 12px;
      font-size: 13px;
      margin-top: 0;
      background: #38bdf8;
      color: #0f172a;
    }
    .danger-btn { background: #ef4444; color: #ffffff; }
    .tables-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .table-card {
      border: 1px solid #334155;
      padding: 12px;
      min-width: 215px;
      border-radius: 10px;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <header>
    <h1>KITCHEN & RECEPTION CONTROL</h1>
    <span id="clock"></span>
  </header>

  <div class="toolbar">
    <label for="paymentPolicySelect"><strong>Payment Mode:</strong></label>
    <select id="paymentPolicySelect" onchange="updatePaymentPolicy()">
      <option value="POST_PAY">POST_PAY (Pay After Serving)</option>
      <option value="PRE_PAY">PRE_PAY (Pay Before Cooking)</option>
    </select>

    <label for="tableCountInput" style="margin-left:14px;"><strong>Total Tables:</strong></label>
    <input id="tableCountInput" type="number" min="1" max="200" value="4" style="width:70px;" />
    <button type="button" onclick="setTableCount()">Update Tables</button>
  </div>

  <div class="grid" id="orderGrid"></div>

  <div class="menu-box">
    <h3 style="margin-top:0;">Chef Menu Manager (Your Own Recipes)</h3>
    <div class="add-form">
      <input id="newDishName" type="text" placeholder="Dish name" style="width:165px;" />
      <input id="newDishPrice" type="number" placeholder="Price (BDT)" style="width:110px;" />
      <input id="newDishFile" type="file" accept="image/*" style="width:205px;" />
      <input id="newDishImg" type="text" placeholder="Or image URL" style="width:170px;" />
      <button type="button" class="mini-btn" onclick="addDish()">+ Add Dish</button>
    </div>
    <div id="menuList"></div>
  </div>

  <h3 style="margin-top:28px;">Live Table Occupancy</h3>
  <div class="tables-grid" id="tablesPanel"></div>

  <script>
    let activeOrders = [];
    let currentMenu = [];

    function isOrderLocked(o) {
      const modeStr = String(o.mode || "").toUpperCase();
      const payStr = String(o.paymentStatus || "").toUpperCase();
      const foodStr = String(o.foodStatus || "PENDING").toUpperCase();
      return modeStr === "PRE_PAY" && payStr === "UNPAID" && foodStr === "PENDING";
    }

    function summarizeItems(rawItems) {
      const counts = new Map();
      (rawItems || []).forEach(function(item) {
        const clean = String(item || "").trim();
        if (!clean) return;
        counts.set(clean, (counts.get(clean) || 0) + 1);
      });
      return Array.from(counts.entries()).map(function(entry) {
        return { name: entry[0], qty: entry[1] };
      });
    }

    function speakKitchenBilingualPa(guestName, tableNumber) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const who = guestName || "Guest";
      const enText = "Attention please. Table number " + tableNumber + ", " + who + ", your order is ready.";
      const bnFallback = "Tebil nombor " + tableNumber + ", " + who + ", apnar order ready hoyasay, order tih, kauntar thaikay, shongrohoh, korun.";
      const bnScript = "টেবিল নম্বর " + tableNumber + ", " + who + ", আপনার অর্ডার রেডি হয়েছে, অর্ডারটি কাউন্টার থেকে সংগ্রহ করুন।";

      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const bnVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().startsWith("bn");
      });

      const enUtterance = new SpeechSynthesisUtterance(enText);
      enUtterance.lang = "en-US";
      enUtterance.rate = 0.92;
      window.speechSynthesis.speak(enUtterance);

      if (bnVoice) {
        const bnUtterance = new SpeechSynthesisUtterance(bnScript);
        bnUtterance.voice = bnVoice;
        bnUtterance.lang = bnVoice.lang;
        bnUtterance.rate = 0.9;
        window.speechSynthesis.speak(bnUtterance);
      } else {
        const phoneticUtterance = new SpeechSynthesisUtterance(bnFallback);
        phoneticUtterance.lang = "en-US";
        phoneticUtterance.rate = 0.88;
        window.speechSynthesis.speak(phoneticUtterance);
      }
    }

    async function loadPaymentPolicy() {
      try {
        const res = await fetch("/api/config/payment");
        if (!res.ok) return;
        const data = await res.json();
        if (data.mode) {
          document.getElementById("paymentPolicySelect").value = data.mode;
        }
      } catch (e) {}
    }

    async function updatePaymentPolicy() {
      const mode = document.getElementById("paymentPolicySelect").value;
      await fetch("/api/config/payment?mode=" + encodeURIComponent(mode), { method: "POST" });
      await fetchOrders();
    }

    async function triggerPaCall(orderId, guestName, tableNumber) {
      await fetch("/api/order/pa?id=" + encodeURIComponent(orderId), { method: "POST" });
      speakKitchenBilingualPa(guestName, tableNumber);
    }

    async function fetchOrders() {
      try {
        const res = await fetch("/api/orders");
        if (!res.ok) return;
        const all = await res.json();
        activeOrders = all
          .filter(function(o) { return String(o.foodStatus || "").toUpperCase() !== "SERVED"; })
          .sort(function(a, b) {
            return (isOrderLocked(a) ? 0 : 1) - (isOrderLocked(b) ? 0 : 1);
          });
        renderOrders();
      } catch (e) {}
    }

    async function unlockCashPayment(orderId) {
      const res = await fetch("/api/order/pay?id=" + encodeURIComponent(orderId), { method: "POST" });
      if (res.ok) {
        await fetchOrders();
      } else {
        const err = await res.json().catch(function() { return {}; });
        alert(err.error || "Could not approve cash payment.");
      }
    }

    async function advanceOrder(index) {
      const order = activeOrders[index];
      if (!order) return;

      if (isOrderLocked(order)) {
        alert("This pre-pay cash order is locked until payment is approved.");
        return;
      }

      let nextStatus = null;
      if (order.foodStatus === "PENDING") nextStatus = "PREPARING";
      else if (order.foodStatus === "PREPARING") nextStatus = "READY";
      else if (order.foodStatus === "READY") nextStatus = "SERVED";

      if (nextStatus) {
        const url = "/api/order/status?id=" + encodeURIComponent(order.id) + "&status=" + encodeURIComponent(nextStatus);
        const res = await fetch(url, { method: "POST" });
        if (!res.ok) {
          const err = await res.json().catch(function() { return {}; });
          alert(err.error || "Cannot advance order.");
          return;
        }
        if (nextStatus === "READY") {
          await triggerPaCall(order.id, order.guestName, order.tableNumber);
        }
        await fetchOrders();
      }
    }

    function renderOrders() {
      const grid = document.getElementById("orderGrid");
      grid.innerHTML = activeOrders.map(function(o, i) {
        const locked = isOrderLocked(o);
        const cardClass = "card " + o.foodStatus + (locked ? " locked" : "");
        const grouped = summarizeItems(o.items);
        const totalPcs = grouped.reduce(function(sum, g) { return sum + g.qty; }, 0);

        const btnText = locked
          ? "LOCKED (Awaiting Cash Approval)"
          : (o.foodStatus === "PENDING" ? "START COOKING"
            : (o.foodStatus === "PREPARING" ? "MARK READY & CALL GUEST" : "MARK SERVED"));

        const itemsHtml = grouped.map(function(g) {
          return "<li>• <strong>" + g.name + "</strong> <span style='color:#38bdf8;'>× " + g.qty + " pcs</span></li>";
        }).join("");

        const safeName = (o.guestName || "Guest").replace(/'/g, "\\'");
        const lockBanner = locked
          ? '<div class="lock-note">🔒 <strong>Pre-Pay Cash Hold:</strong> Collect ' + (o.total || 0) + ' BDT and approve below to unlock cooking.</div>'
          : "";
        const unlockBtn = locked
          ? '<button type="button" class="unlock-btn" onclick="unlockCashPayment(\'' + o.id + '\')">✅ Approve Cash & Unlock Cooking</button>'
          : "";
        const paButton = (o.foodStatus === "READY")
          ? '<button type="button" class="pa-btn" onclick="triggerPaCall(\'' + o.id + '\', \'' + safeName + '\', ' + o.tableNumber + ')">📢 PA Call (EN + Bangla)</button>'
          : "";

        return '<div class="' + cardClass + '">' +
          '<div>' +
            '<div class="order-top">' +
              '<span>Table #' + o.tableNumber + ' (' + o.id + ')</span>' +
              '<span class="badge ' + (locked ? "locked-badge" : "") + '">' +
                (locked ? "LOCKED • CASH UNPAID" : (o.mode + " • " + o.paymentStatus)) +
              '</span>' +
            '</div>' +
            '<div class="guest-tag">Guest: <strong>' + (o.guestName || "Guest") + '</strong> (' + totalPcs + ' pcs total)</div>' +
            lockBanner +
            '<ul class="item-list">' + itemsHtml + '</ul>' +
            '<div style="color:#cbd5e1; font-size:14px; margin-bottom:8px;">Total: <strong>' + (o.total || 0) + ' BDT</strong></div>' +
          '</div>' +
          '<div>' +
            unlockBtn +
            paButton +
            '<button type="button" class="stage-btn" ' + (locked ? "disabled" : "") + ' onclick="advanceOrder(' + i + ')">' + btnText + '</button>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    async function loadChefMenu() {
      try {
        const res = await fetch("/api/menu?all=true");
        if (!res.ok) return;
        currentMenu = await res.json();
        const box = document.getElementById("menuList");

        if (!currentMenu.length) {
          box.innerHTML = '<p style="color:#94a3b8; margin:8px 0;">No recipes added yet. Add your own dishes above.</p>';
          return;
        }

        box.innerHTML = currentMenu.map(function(m, idx) {
          const imgTag = m.imageUrl
            ? '<img src="' + m.imageUrl + '" alt="' + m.name + '" onerror="this.style.display=\'none\'" />'
            : '<div style="width:54px;height:54px;border-radius:8px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11px;">No Img</div>';

          return '<div class="menu-row">' +
            '<div style="display:flex; align-items:center; gap:12px;">' +
              imgTag +
              '<div>' +
                '<strong>' + m.name + '</strong> — ' + m.price + ' BDT<br/>' +
                '<small style="color:#94a3b8;">Display: ' + (m.visible ? "Shown" : "Hidden") + ' | Stock: ' + (m.available ? "Available" : "Sold Out") + '</small>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
              '<button type="button" class="mini-btn" onclick="toggleMenu(\'' + m.id + '\', \'visible\', ' + (!m.visible) + ')">' + (m.visible ? "Hide" : "Show") + '</button>' +
              '<button type="button" class="mini-btn" onclick="toggleMenu(\'' + m.id + '\', \'available\', ' + (!m.available) + ')">' + (m.available ? "Mark Sold Out" : "Mark Available") + '</button>' +
              '<button type="button" class="mini-btn" onclick="editDish(' + idx + ')">Edit</button>' +
              '<button type="button" class="mini-btn danger-btn" onclick="deleteDish(\'' + m.id + '\')">Delete</button>' +
            '</div>' +
          '</div>';
        }).join("");
      } catch (e) {}
    }

    async function toggleMenu(id, field, val) {
      const url = "/api/menu/toggle?id=" + encodeURIComponent(id) + "&" + field + "=" + val;
      await fetch(url, { method: "POST" });
      await loadChefMenu();
    }

    async function editDish(idx) {
      const dish = currentMenu[idx];
      if (!dish) return;
      const newName = prompt("Dish name:", dish.name);
      if (newName === null || !newName.trim()) return;
      const newPrice = prompt("Price (BDT):", dish.price);
      if (newPrice === null) return;
      const newImg = prompt("Image URL or data URL:", dish.imageUrl || "");
      if (newImg === null) return;

      const body = "id=" + encodeURIComponent(dish.id) +
                   "&name=" + encodeURIComponent(newName.trim()) +
                   "&price=" + encodeURIComponent(newPrice.trim() || "0") +
                   "&imageUrl=" + encodeURIComponent(newImg.trim());

      const res = await fetch("/api/menu/edit", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      });
      if (res.ok) {
        await loadChefMenu();
      } else {
        alert("Could not update dish.");
      }
    }

    async function deleteDish(id) {
      if (!confirm("Remove this dish from your menu?")) return;
      const res = await fetch("/api/menu/delete?id=" + encodeURIComponent(id), { method: "POST" });
      if (res.ok) {
        await loadChefMenu();
      }
    }

    function fileToResizedDataUrl(file) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement("canvas");
            const maxW = 320;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function addDish() {
      const name = document.getElementById("newDishName").value.trim();
      const price = document.getElementById("newDishPrice").value.trim() || "0";
      const fileInput = document.getElementById("newDishFile");
      let img = document.getElementById("newDishImg").value.trim();

      if (!name) {
        alert("Enter a dish name.");
        return;
      }

      if (fileInput.files && fileInput.files[0]) {
        img = await fileToResizedDataUrl(fileInput.files[0]);
      }

      const body = "name=" + encodeURIComponent(name) +
                   "&price=" + encodeURIComponent(price) +
                   "&imageUrl=" + encodeURIComponent(img);

      const res = await fetch("/api/menu/add", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      });

      if (!res.ok) {
        const text = await res.text();
        alert("Could not add dish (" + res.status + "): " + text);
        return;
      }

      document.getElementById("newDishName").value = "";
      document.getElementById("newDishPrice").value = "";
      document.getElementById("newDishImg").value = "";
      fileInput.value = "";
      await loadChefMenu();
    }

    async function setTableCount() {
      const count = document.getElementById("tableCountInput").value;
      const res = await fetch("/api/tables/config?count=" + encodeURIComponent(count), { method: "POST" });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error || "Could not update table count");
        return;
      }
      await loadTables();
    }

    async function loadTables() {
      try {
        const res = await fetch("/api/tables");
        if (!res.ok) return;
        const tables = await res.json();
        const panel = document.getElementById("tablesPanel");

        panel.innerHTML = tables.map(function(t) {
          const isEmpty = t.status === "EMPTY";
          const guestInfo = (!isEmpty && t.guestName)
            ? "Guest: " + t.guestName + (t.guestPhone ? " (" + t.guestPhone + ")" : "")
            : "No active guest";
          return '<div class="table-card">' +
            '<strong>Table #' + t.tableNumber + '</strong> — <span>' + t.status + '</span><br/>' +
            '<small style="color:#94a3b8;">' + guestInfo + '</small><br/>' +
            '<button type="button" style="margin-top:8px; padding:8px; font-size:13px;" onclick="freeTable(' + t.tableNumber + ')">Mark Clean (Free)</button>' +
          '</div>';
        }).join("");
      } catch (e) {}
    }

    async function freeTable(tableNum) {
      const res = await fetch("/api/table/free?table=" + encodeURIComponent(tableNum), { method: "POST" });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error || "Could not free table");
        return;
      }
      await loadTables();
    }

    setInterval(function() {
      document.getElementById("clock").innerText = new Date().toLocaleTimeString();
      fetchOrders();
      loadTables();
    }, 1500);

    loadPaymentPolicy();
    fetchOrders();
    loadChefMenu();
    loadTables();
  </script>
</body>
</html>
